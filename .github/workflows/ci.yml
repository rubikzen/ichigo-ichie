name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contract family isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: https://www.ichigoichiematcha.fr
      RESTOCK_UNSUBSCRIBE_SECRET: ci-only-restock-management-key-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: B balanced
        if: always()
        run: node --test tests/contracts/balanced-*.test.mjs
      - name: B boutique collection
        if: always()
        run: node --test tests/contracts/boutique-collection-*.test.mjs
      - name: B boutique first
        if: always()
        run: node --test tests/contracts/boutique-first-*.test.mjs
      - name: B boutique toolbar
        if: always()
        run: node --test tests/contracts/boutique-toolbar-*.test.mjs

      - name: C cart
        if: always()
        run: node --test tests/contracts/cart-*.test.mjs
      - name: C checkout
        if: always()
        run: node --test tests/contracts/checkout-*.test.mjs
      - name: C ci
        if: always()
        run: node --test tests/contracts/ci-*.test.mjs
      - name: C clean
        if: always()
        run: node --test tests/contracts/clean-*.test.mjs
      - name: C commerce
        if: always()
        run: node --test tests/contracts/commerce-*.test.mjs
      - name: C commercial
        if: always()
        run: node --test tests/contracts/commercial-*.test.mjs
      - name: C conversion
        if: always()
        run: node --test tests/contracts/conversion-*.test.mjs
      - name: C customer
        if: always()
        run: node --test tests/contracts/customer-*.test.mjs

      - name: P payment
        if: always()
        run: node --test tests/contracts/payment-*.test.mjs
      - name: P pickup
        if: always()
        run: node --test tests/contracts/pickup-*.test.mjs
      - name: P product card
        if: always()
        run: node --test tests/contracts/product-card-*.test.mjs
      - name: P product content
        if: always()
        run: node --test tests/contracts/product-content-*.test.mjs
      - name: P product detail
