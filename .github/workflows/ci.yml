name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contract isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: https://www.ichigoichiematcha.fr
      RESTOCK_UNSUBSCRIBE_SECRET: ci-only-restock-management-key-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contracts A
        if: always()
        run: node --test tests/contracts/a*.test.mjs
      - name: Contracts B
        if: always()
        run: node --test tests/contracts/b*.test.mjs
      - name: Contracts C
        if: always()
        run: node --test tests/contracts/c*.test.mjs
      - name: Contracts P
        if: always()
        run: node --test tests/contracts/p*.test.mjs
      - name: Contracts Q
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/q*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"
      - name: Contracts R
        if: always()
        run: node --test tests/contracts/r*.test.mjs
      - name: Contracts S
        if: always()
        run: node --test tests/contracts/s*.test.mjs
      - name: Contracts T
        if: always()
        run: node --test tests/contracts/t*.test.mjs
      - name: Contracts U
        if: always()
        run: node --test tests/contracts/u*.test.mjs
