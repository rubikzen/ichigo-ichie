      - name: P product image
        if: always()
        run: node --test tests/contracts/product-image-*.test.mjs
      - name: P product page
        if: always()
        run: node --test tests/contracts/product-page-*.test.mjs
      - name: P product review
        if: always()
        run: node --test tests/contracts/product-review*.test.mjs
      - name: P product sellability
        if: always()
        run: node --test tests/contracts/product-sellability-*.test.mjs
      - name: P product stock
