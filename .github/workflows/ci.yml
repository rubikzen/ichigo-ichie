name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: https://www.ichigoichiematcha.fr
      RESTOCK_UNSUBSCRIBE_SECRET: ci-only-restock-management-key-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Debug contracts A-C
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[a-c]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts D-F
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[d-f]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts G-I
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[g-i]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts J-L
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[j-l]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts M-O
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[m-o]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts P-R
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[p-r]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts S-U
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[s-u]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Debug contracts V-Z
        if: always()
        run: |
          shopt -s nullglob
          files=(tests/contracts/[v-z]*.test.mjs)
          ((${#files[@]} == 0)) || node --test "${files[@]}"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests on current commit
        run: npm run e2e:local

      - name: Production API smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run smoke

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
